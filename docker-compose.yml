services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip_app
    restart: unless-stopped
    working_dir: /var/www/trip
    volumes:
      - ./:/var/www/trip
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: trip_db
      DB_USERNAME: trip_user
      DB_PASSWORD: trip_password
    depends_on:
      - db
    networks:
      - trip_network

  web:
    image: nginx:alpine
    container_name: trip_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/trip:ro
      - ./deployment/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - trip_network

  db:
    image: mysql:8.0
    container_name: trip_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trip_db
      MYSQL_USER: trip_user
      MYSQL_PASSWORD: trip_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - trip_network

networks:
  trip_network:
    driver: bridge

volumes:
  db_data:
    driver: local
